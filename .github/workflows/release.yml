name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            target: x86_64-unknown-linux-gnu
            artifact-name: AetherCast-x86_64-linux-gnu
            binary: AetherCast
          - name: windows
            target: x86_64-pc-windows-gnu
            artifact-name: AetherCast-x86_64-pc-windows-gnu
            binary: AetherCast.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      - name: Install Windows cross-compiler
        if: matrix.name == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64

      - name: Add Windows target
        if: matrix.name == 'windows'
        run: rustup target add x86_64-pc-windows-gnu

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          retention-days: 1

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            AetherCast-x86_64-linux-gnu/AetherCast
            AetherCast-x86_64-pc-windows-gnu/AetherCast.exe
