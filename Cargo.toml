[package]
name = "AetherCast"
version = "0.1.0"
edition = "2024"
description = "A desktop weather application with Slint UI and multi-provider weather APIs"
authors = ["AetherCast Contributors"]
license = "MIT"

[dependencies]
slint = { version = "1.18", features = ["backend-default", "renderer-femtovg"] }
reqwest = { version = "0.13", features = ["json", "rustls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "registry"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "1"
dirs = "7"
thiserror = "1"
async-trait = "0.1"


[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
tempfile = "3"
